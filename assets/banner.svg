<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#311042"/>
    </linearGradient>

    <!-- Glowing Accent Gradient -->
    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <!-- Animated Wave Line Gradient -->
    <linearGradient id="lineGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.2"/>
      <stop offset="50%" stop-color="#3b82f6" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0.2"/>
    </linearGradient>

    <!-- Card Background Gradient -->
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9"/>
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .title {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-size: 46px;
      font-weight: 800;
      fill: #ffffff;
      letter-spacing: -0.5px;
    }
    .subtitle {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-size: 20px;
      font-weight: 400;
      fill: #cbd5e1;
    }
    .badge-text {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-size: 13px;
      font-weight: 600;
      fill: #38bdf8;
    }
    
    /* Animations */
    @keyframes pulseGlow {
      0%, 100% { opacity: 0.4; transform: scale(1); }
      50% { opacity: 0.8; transform: scale(1.05); }
    }
    @keyframes dashStream {
      0% { stroke-dashoffset: 1000; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes floatParticle {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-12px); }
    }

    .pulsing-orb {
      animation: pulseGlow 6s ease-in-out infinite;
      transform-origin: 950px 180px;
    }
    .animated-wave {
      stroke-dasharray: 20 10;
      animation: dashStream 30s linear infinite;
    }
    .floating-card {
      animation: floatParticle 4s ease-in-out infinite;
    }
  </style>

  <!-- Background Base -->
  <rect width="1200" height="360" rx="16" fill="url(#bgGradient)"/>
  <rect width="1196" height="356" x="2" y="2" rx="14" fill="none" stroke="url(#accentGradient)" stroke-width="1.5" stroke-opacity="0.3"/>

  <!-- Background Dynamic Graphic Elements (Stay Behind Overlay/Text) -->
  <g class="pulsing-orb">
    <circle cx="980" cy="180" r="160" fill="#6366f1" opacity="0.15" filter="url(#glow)"/>
    <circle cx="980" cy="180" r="90" fill="#a855f7" opacity="0.12" filter="url(#glow)"/>
  </g>

  <!-- Dynamic Waveform Lines (Simulating Time-Series Streams) -->
  <path class="animated-wave" d="M 0 260 Q 300 180, 600 240 T 1200 190" fill="none" stroke="url(#lineGradient)" stroke-width="4"/>
  <path class="animated-wave" d="M 0 290 Q 400 220, 800 280 T 1200 220" fill="none" stroke="#38bdf8" stroke-width="2" opacity="0.3"/>

  <!-- Subtle Floating Visual Cards (Positioned to the Right to keep Center/Left Title Clear) -->
  <g class="floating-card" transform="translate(850, 70)">
    <rect width="280" height="75" rx="12" fill="url(#cardBg)" stroke="#334155" stroke-width="1"/>
    <path d="M 870 115 L 910 95 L 940 120 L 980 85 L 1020 105 L 1090 75" fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="1090" cy="75" r="4" fill="#38bdf8" filter="url(#glow)"/>
    <text x="870" y="93" font-family="sans-serif" font-size="11" fill="#94a3b8" font-weight="600">INJECTION TELEMETRY / SEC</text>
    <text x="870" y="133" font-family="sans-serif" font-size="16" fill="#f8fafc" font-weight="700">2.4M ops/sec</text>
  </g>

  <g class="floating-card" transform="translate(890, 175)" style="animation-delay: -2s;">
    <rect width="240" height="65" rx="12" fill="url(#cardBg)" stroke="#334155" stroke-width="1"/>
    <text x="910" y="198" font-family="sans-serif" font-size="11" fill="#94a3b8" font-weight="600">QUERY LATENCY (P99)</text>
    <text x="910" y="225" font-family="sans-serif" font-size="18" fill="#4ade80" font-weight="700">&lt; 12ms</text>
  </g>

  <!-- Foreground Title Header & Subtitle (Clear Focus) -->
  <g transform="translate(70, 0)">
    <!-- Pill Badge -->
    <rect x="0" y="65" width="230" height="30" rx="15" fill="#0f172a" stroke="#38bdf8" stroke-width="1"/>
    <text x="15" y="85" class="badge-text">⚡ SERVERLESS TSDB ECOSYSTEM</text>

    <!-- Main Title -->
    <text x="0" y="150" class="title">Awesome Serverless</text>
    <text x="0" y="200" class="title" fill="url(#accentGradient)">Time-Series Database</text>

    <!-- Subtitle -->
    <text x="0" y="248" class="subtitle">Curated SaaS Platforms, Distributed Metrics Engines &amp; Real-Time Analytics</text>

    <!-- Tags/Highlights -->
    <g transform="translate(0, 275)">
      <rect x="0" y="0" width="110" height="26" rx="6" fill="#1e293b"/>
      <text x="12" y="17" font-family="sans-serif" font-size="12" fill="#94a3b8">📊 Prometheus</text>

      <rect x="120" y="0" width="105" height="26" rx="6" fill="#1e293b"/>
      <text x="132" y="17" font-family="sans-serif" font-size="12" fill="#94a3b8">⚡ ClickHouse</text>

      <rect x="235" y="0" width="100" height="26" rx="6" fill="#1e293b"/>
      <text x="247" y="17" font-family="sans-serif" font-size="12" fill="#94a3b8">📈 InfluxDB</text>

      <rect x="345" y="0" width="105" height="26" rx="6" fill="#1e293b"/>
      <text x="357" y="17" font-family="sans-serif" font-size="12" fill="#94a3b8">🐘 Timescale</text>
    </g>
  </g>
</svg>
